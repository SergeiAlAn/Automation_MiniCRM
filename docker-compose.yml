services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: crm-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      # Живой код для отладки без пересборки образа
      - ./backend:/app/backend
      # Персистентная SQLite БД
      - ./data:/app/data
      # Локальные переменные окружения
      - ./.env:/app/.env:ro
    working_dir: /app
    command:
      [
        "watchmedo",
        "auto-restart",
        "--directory=/app/backend",
        "--pattern=*.py",
        "--recursive",
        "--debug-force-polling",
        "--",
        "uvicorn",
        "backend.api:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    restart: unless-stopped
